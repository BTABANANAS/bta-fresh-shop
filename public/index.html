<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTA Fresh — Bananas, ripened to order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --yellow: #F4C430; --yellow-deep: #E0A800; --leaf: #2D4A1F; --leaf-light: #4A7A34;
    --paper: #FBF6E9; --paper-dim: #F2EAD2; --ink: #2B1B0E; --red-banana: #A8432F;
    --white: #FFFDF7; --shadow: rgba(43,27,14,0.14); --r1: 22px; --r2: 14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{ background: var(--paper); color: var(--ink); font-family:'Inter',sans-serif; line-height:1.5; overflow-x:hidden; }
  h1,h2,h3{ font-family:'Bricolage Grotesque',sans-serif; font-weight:800; letter-spacing:-0.02em; line-height:1.02; }
  .mono{ font-family:'JetBrains Mono', monospace; }
  a{color:inherit;}
  .wrap{ max-width:1180px; margin:0 auto; padding:0 32px; }
  :focus-visible{ outline:3px solid var(--leaf); outline-offset:2px; }

  header{ position:sticky; top:0; z-index:50; background:rgba(251,246,233,0.88); backdrop-filter:blur(10px); border-bottom:1px solid rgba(43,27,14,0.08); }
  nav{ display:flex; align-items:center; justify-content:space-between; padding:18px 32px; max-width:1180px; margin:0 auto; }
  .logo{ display:flex; align-items:center; gap:10px; font-size:22px; }
  .logo svg{ width:26px; height:26px; }
  .navright{ display:flex; align-items:center; gap:14px; }
  .admin-btn{ background:transparent; color:var(--ink); border:1.5px solid rgba(43,27,14,0.25); border-radius:999px; padding:10px 18px; font-weight:600; font-size:14px; cursor:pointer; text-decoration:none; display:inline-block; }
  .admin-btn:hover{ background:rgba(43,27,14,0.06); }
  .cart-btn{ position:relative; background:var(--ink); color:var(--paper); border:none; border-radius:999px; padding:11px 20px 11px 18px; font-weight:600; font-size:14px; display:flex; align-items:center; gap:8px; cursor:pointer; }
  .cart-count{ background:var(--yellow); color:var(--ink); border-radius:999px; min-width:20px; height:20px; padding:0 5px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; }

  .hero-simple{ padding:64px 32px 44px; text-align:center; }
  .hero-simple h1{ font-size:clamp(40px,6vw,64px); }
  .hero-simple .lede{ margin:14px auto 0; opacity:0.75; }

  .section{ padding:50px 0 70px; }
  .products{ display:grid; grid-template-columns:repeat(3,1fr); gap:22px; }
  .card{ background:var(--white); border-radius:var(--r1); padding:22px; border:1px solid rgba(43,27,14,0.07); display:flex; flex-direction:column; transition:transform .18s ease, box-shadow .18s ease; }
  .card:hover{ transform:translateY(-4px); box-shadow:0 18px 30px var(--shadow); }
  .card-visual{ height:150px; border-radius:var(--r2); margin-bottom:16px; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
  .card-visual svg{ width:84px; height:auto; }
  .card h3{ font-size:19px; font-weight:700; margin-bottom:4px; }
  .card .variety{ font-family:'JetBrains Mono'; font-size:11.5px; opacity:0.55; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:10px; }
  .card p.desc{ font-size:13.5px; opacity:0.72; flex:1; margin-bottom:16px; }
  .card-foot{ display:flex; justify-content:space-between; align-items:center; }
  .price{ font-family:'JetBrains Mono'; font-weight:700; font-size:17px; }
  .price .unit-label{ font-weight:500; font-size:12px; opacity:0.6; display:block; }
  .add-btn{ background:var(--ink); color:var(--paper); border:none; border-radius:999px; padding:9px 16px; font-weight:700; font-size:13px; cursor:pointer; }
  .add-btn.added{ background:var(--leaf-light); }

  .overlay{ position:fixed; inset:0; background:rgba(43,27,14,0.4); opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:90; }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .drawer{ position:fixed; top:0; right:0; height:100%; width:420px; max-width:92vw; background:var(--paper); z-index:95; box-shadow:-20px 0 40px rgba(43,27,14,0.18); transform:translateX(100%); transition:transform .3s cubic-bezier(.4,0,.2,1); display:flex; flex-direction:column; }
  .drawer.open{ transform:translateX(0); }
  .drawer-head{ padding:26px 26px 18px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(43,27,14,0.08); }
  .close-btn{ background:none; border:none; font-size:22px; cursor:pointer; color:var(--ink); }
  .drawer-body{ flex:1; overflow-y:auto; padding:18px 26px; }
  .cart-item{ display:flex; gap:14px; padding:14px 0; border-bottom:1px solid rgba(43,27,14,0.06); align-items:center; }
  .cart-item .ci-visual{ width:50px; height:50px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .cart-item .ci-visual svg{ width:30px; }
  .ci-info{ flex:1; }
  .ci-info h4{ font-size:14.5px; font-weight:700; }
  .ci-info .ci-pallet{ font-size:11px; opacity:0.5; margin-top:2px; }
  .qty-ctrl{ display:flex; align-items:center; gap:9px; }
  .qty-ctrl button{ width:24px; height:24px; border-radius:50%; border:1.5px solid var(--ink); background:none; font-size:14px; cursor:pointer; font-weight:700; }
  .qty-ctrl span{ font-family:'JetBrains Mono'; font-size:13px; min-width:14px; text-align:center; }
  .empty-cart{ text-align:center; padding:60px 20px; opacity:0.55; font-size:14px; }
  .drawer-foot{ padding:22px 26px 26px; border-top:1px solid rgba(43,27,14,0.08); }
  .subtotal-row{ display:flex; justify-content:space-between; font-size:15px; margin-bottom:16px; }
  .checkout-btn{ width:100%; background:var(--ink); color:var(--paper); border:none; border-radius:999px; padding:16px; font-weight:700; font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; }
  .checkout-btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .spinner{ width:16px; height:16px; border-radius:50%; border:2.5px solid rgba(251,246,233,0.4); border-top-color:var(--paper); animation:spin .7s linear infinite; display:none; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .cart-error{ font-size:12.5px; color:var(--red-banana); margin-top:10px; display:none; }

  footer{ background:var(--ink); color:var(--paper); padding:34px 32px; margin-top:20px; }
  .foot-bottom{ max-width:1180px; margin:0 auto; display:flex; justify-content:space-between; font-size:12.5px; opacity:0.6; flex-wrap:wrap; gap:8px; }

  @media (max-width:860px){ .products{ grid-template-columns:1fr 1fr; } }
  @media (max-width:540px){ .products{ grid-template-columns:1fr; } .drawer{ width:100%; } }
  @media (prefers-reduced-motion: reduce){ *{ transition-duration:0.001ms !important; animation-duration:0.001ms !important; } }
</style>
</head>
<body>

<header>
  <nav>
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 15c0 4 3.5 6 7 6 6 0 10-4.5 10-11.5 0-1-.3-2-.3-2s-1 1-2.5 1c-3 0-3.7-2.5-3.7-2.5S13 8 9 9C5.5 9.8 4 12 4 15z" fill="#F4C430" stroke="#2B1B0E" stroke-width="1.3" stroke-linejoin="round"/></svg>
      BTA Fresh
    </div>
    <div class="navright">
      <a class="admin-btn" href="/admin.html">Admin</a>
      <button class="cart-btn" id="openCart" aria-label="Open cart">Cart <span class="cart-count" id="cartCount">0</span></button>
    </div>
  </nav>
</header>

<section class="hero-simple">
  <div class="wrap">
    <h1>BTA Fresh</h1>
    <p class="lede">Fresh bananas, ready to order.</p>
  </div>
</section>

<div class="wrap">
  <section class="section" id="shop">
    <div class="products" id="productGrid">
      <p style="opacity:0.6; grid-column:1/-1;">Loading products…</p>
    </div>
  </section>
</div>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-label="Shopping cart">
  <div class="drawer-head">
    <h3>Your cart</h3>
    <button class="close-btn" id="closeCart" aria-label="Close cart">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot">
    <div class="subtotal-row"><span>Total cartons</span><strong id="subtotalVal">0</strong></div>
    <button class="checkout-btn" id="checkoutBtn" disabled>
      <span class="spinner" id="checkoutSpinner"></span>
      <span id="checkoutLabel">Checkout</span>
    </button>
    <div class="cart-error" id="cartError"></div>
  </div>
</aside>

<footer>
  <div class="foot-bottom">
    <span>© 2026 BTA Fresh</span>
    <span>Secure checkout powered by Stripe.</span>
  </div>
</footer>

<script>
const MAX_CARTONS_PER_PALLET = 66;
let PRODUCTS = [];
let cart = {};

function bananaSVG(color){
  return `<svg viewBox="0 0 120 200" fill="none">
    <path d="M55 15C40 15 30 40 28 75C26 115 35 155 65 175C90 192 105 175 100 158C97 148 85 150 78 145C95 138 100 115 95 90C92 70 80 25 55 15Z" fill="${color}" stroke="#2B1B0E" stroke-width="2.5" stroke-linejoin="round"/>
  </svg>`;
}
const COLORS = { cavendish:'#F4C430', ladyfinger:'#F0B429', havana:'#E8A427' };
function shade(hex){ return `${hex}22`; }

async function loadProducts(){
  const res = await fetch('/api/products');
  const data = await res.json();
  PRODUCTS = data.products;
  const grid = document.getElementById('productGrid');
  grid.innerHTML = '';
  PRODUCTS.forEach(p=>{
    const color = COLORS[p.id] || '#F4C430';
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-visual" style="background:${shade(color)}">${bananaSVG(color)}</div>
      <h3>${p.name}</h3>
      <div class="variety">${p.variety || ''}</div>
      <p class="desc">Fresh, quality bananas — ${p.name.toLowerCase()}.</p>
      <div class="card-foot">
        <span class="price">$${p.price.toFixed(2)}<span class="unit-label">per carton</span></span>
        <button class="add-btn" data-id="${p.id}">Add to cart</button>
      </div>
    `;
    grid.appendChild(card);
  });
}

document.getElementById('productGrid').addEventListener('click', e=>{
  const btn = e.target.closest('.add-btn');
  if(!btn) return;
  const id = btn.dataset.id;
  if((cart[id]||0) >= MAX_CARTONS_PER_PALLET){
    btn.textContent = 'Pallet full';
    setTimeout(()=>{ btn.textContent='Add to cart'; }, 900);
    return;
  }
  cart[id] = (cart[id]||0) + 1;
  btn.textContent = 'Added ✓';
  btn.classList.add('added');
  setTimeout(()=>{ btn.textContent='Add to cart'; btn.classList.remove('added'); }, 900);
  renderCart();
});

const overlay = document.getElementById('overlay');
const drawer = document.getElementById('drawer');
const drawerBody = document.getElementById('drawerBody');
const cartCount = document.getElementById('cartCount');
const subtotalVal = document.getElementById('subtotalVal');
const checkoutBtn = document.getElementById('checkoutBtn');
const cartError = document.getElementById('cartError');

function cartItems(){
  return Object.entries(cart).filter(([,q])=>q>0).map(([id,qty])=>{
    const p = PRODUCTS.find(x=>x.id===id);
    return {...p, qty};
  });
}

function renderCart(){
  const items = cartItems();
  const totalQty = items.reduce((s,i)=>s+i.qty,0);
  cartCount.textContent = totalQty;
  checkoutBtn.disabled = totalQty === 0;

  if(items.length===0){
    drawerBody.innerHTML = `<div class="empty-cart">Your cart is empty.<br>Add a carton to get started.</div>`;
    subtotalVal.textContent = '0';
    return;
  }

  drawerBody.innerHTML = items.map(i=>`
    <div class="cart-item" data-id="${i.id}">
      <div class="ci-visual" style="background:${shade(COLORS[i.id]||'#F4C430')}">${bananaSVG(COLORS[i.id]||'#F4C430')}</div>
      <div class="ci-info">
        <h4>${i.name}</h4>
        <div class="ci-pallet mono">${i.qty} of ${MAX_CARTONS_PER_PALLET} per pallet · $${(i.qty*i.price).toFixed(2)}</div>
      </div>
      <div class="qty-ctrl">
        <button class="dec" aria-label="Decrease quantity">–</button>
        <span>${i.qty}</span>
        <button class="inc" aria-label="Increase quantity" ${i.qty >= MAX_CARTONS_PER_PALLET ? 'disabled' : ''}>+</button>
      </div>
    </div>
  `).join('');

  subtotalVal.textContent = totalQty;
}

drawerBody.addEventListener('click', e=>{
  const row = e.target.closest('.cart-item');
  if(!row) return;
  const id = row.dataset.id;
  if(e.target.classList.contains('inc')) cart[id] = Math.min(MAX_CARTONS_PER_PALLET, cart[id]+1);
  if(e.target.classList.contains('dec')) cart[id] = Math.max(0, cart[id]-1);
  renderCart();
});

document.getElementById('openCart').addEventListener('click', ()=>{
  overlay.classList.add('open'); drawer.classList.add('open');
});
function closeDrawer(){ overlay.classList.remove('open'); drawer.classList.remove('open'); }
document.getElementById('closeCart').addEventListener('click', closeDrawer);
overlay.addEventListener('click', closeDrawer);

checkoutBtn.addEventListener('click', async ()=>{
  if(checkoutBtn.disabled) return;
  cartError.style.display = 'none';
  checkoutBtn.disabled = true;
  document.getElementById('checkoutSpinner').style.display = 'inline-block';
  document.getElementById('checkoutLabel').textContent = 'Redirecting…';

  const items = cartItems().map(i=>({ id:i.id, qty:i.qty }));
  try{
    const res = await fetch('/api/checkout', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ items })
    });
    const data = await res.json();
    if(!res.ok || !data.url) throw new Error(data.error || 'Checkout failed');
    window.location.href = data.url; // redirect to Stripe-hosted checkout page
  }catch(err){
    cartError.textContent = err.message || 'Something went wrong. Please try again.';
    cartError.style.display = 'block';
    checkoutBtn.disabled = false;
    document.getElementById('checkoutSpinner').style.display = 'none';
    document.getElementById('checkoutLabel').textContent = 'Checkout';
  }
});

renderCart();
loadProducts();
</script>
</body>
</html>
