<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout cancelled — BTA Fresh</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#FBF6E9; --ink:#2B1B0E; --white:#FFFDF7; --shadow:rgba(43,27,14,0.14); }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{ background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  h1{ font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:26px; margin-bottom:8px; }
  .card{ background:var(--white); border-radius:22px; padding:36px 32px; max-width:420px; width:100%; text-align:center; box-shadow:0 20px 44px var(--shadow); }
  p{ opacity:0.75; font-size:14.5px; margin-bottom:20px; }
  a.btn{ display:inline-block; background:var(--ink); color:var(--paper); text-decoration:none; padding:14px 26px; border-radius:999px; font-weight:700; font-size:14.5px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Checkout cancelled</h1>
    <p>No payment was taken. Your cart may still be waiting for you.</p>
    <a class="btn" href="/">Back to shop</a>
  </div>
</body>
</html>
