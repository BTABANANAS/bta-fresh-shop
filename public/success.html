<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order confirmed — BTA Fresh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#FBF6E9; --ink:#2B1B0E; --leaf:#2D4A1F; --white:#FFFDF7; --shadow:rgba(43,27,14,0.14); }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{ background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  h1{ font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:26px; margin-bottom:8px; }
  .card{ background:var(--white); border-radius:22px; padding:36px 32px; max-width:440px; width:100%; text-align:center; box-shadow:0 20px 44px var(--shadow); }
  .icon{ width:60px; height:60px; margin:0 auto 18px; }
  p{ opacity:0.75; font-size:14.5px; margin-bottom:20px; }
  .order-id{ font-family:'JetBrains Mono'; font-size:13px; background:var(--paper); border-radius:10px; padding:12px; margin-bottom:20px; }
  .items{ text-align:left; font-size:13.5px; margin-bottom:20px; }
  .items li{ display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid rgba(43,27,14,0.08); list-style:none; }
  a.btn{ display:inline-block; background:var(--ink); color:var(--paper); text-decoration:none; padding:14px 26px; border-radius:999px; font-weight:700; font-size:14.5px; }
</style>
</head>
<body>
  <div class="card" id="content">
    <p>Loading your order…</p>
  </div>

<script>
async function run(){
  const params = new URLSearchParams(window.location.search);
  const sessionId = params.get('session_id');
  const el = document.getElementById('content');
  if(!sessionId){
    el.innerHTML = '<h1>No order found</h1><p>We couldn\'t find a session for this order.</p><a class="btn" href="/">Back to shop</a>';
    return;
  }
  try{
    const res = await fetch(`/api/order-status?session_id=${encodeURIComponent(sessionId)}`);
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Order not found');

    const itemsHtml = (data.items||[]).map(i=>`<li><span>${i.name} × ${i.qty}</span><span>$${(i.qty*i.price).toFixed(2)}</span></li>`).join('');

    if(data.status === 'paid'){
      el.innerHTML = `
        <svg class="icon" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="30" fill="#2D4A1F"/><path d="M20 33l8 8 16-18" stroke="#FBF6E9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <h1>Order confirmed</h1>
        <p>Thanks — your order is scheduled for delivery. A confirmation has been sent by email.</p>
        <div class="order-id">Order ${data.orderRef}</div>
        <ul class="items">${itemsHtml}</ul>
        <a class="btn" href="/">Back to shop</a>
      `;
    } else {
      el.innerHTML = `
        <h1>Payment processing</h1>
        <p>We're still confirming your payment with Stripe — refresh this page in a moment, or check your email for confirmation.</p>
        <a class="btn" href="/">Back to shop</a>
      `;
    }
  }catch(err){
    el.innerHTML = `<h1>Couldn't load order</h1><p>${err.message}</p><a class="btn" href="/">Back to shop</a>`;
  }
}
run();
</script>
</body>
</html>
